receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  batch:
    timeout: 200ms
  # Only OCSF Network Activity and HTTP Activity records go to the detector.
  filter/network:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["ocsf.class_uid"] != 4001 and attributes["ocsf.class_uid"] != 4002'

exporters:
  otlp/detector:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true
    sending_queue:
      queue_size: 10000
  otlp/lgtm:
    endpoint: 127.0.0.1:24317
    tls:
      insecure: true

service:
  pipelines:
    logs/detector:
      receivers: [otlp]
      processors: [filter/network, batch]
      exporters: [otlp/detector]
    logs/lgtm:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
    traces/lgtm:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
