[workspace]

[package]
name = "openshell-egress-usage-detector"
description = "Example external detector that reacts to OpenShell OCSF egress events"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
openshell-ocsf = { path = "../../crates/openshell-ocsf" }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "logs"] }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "process", "rt-multi-thread", "sync"] }
tonic = { version = "0.14", features = ["gzip", "transport"] }

[[bin]]
name = "egress-usage-detector"
path = "src/main.rs"
